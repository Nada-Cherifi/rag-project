# Contrôle le niveau de créativité et de variabilité des réponses du modèle.
# Une valeur faible produit des réponses plus stables, factuelles et prévisibles.
# Une valeur élevée produit des réponses plus variées et plus créatives.
# Pour un assistant technique Orange basé sur un RAG, 0.2 est recommandé
# afin de limiter les hallucinations et de rester fidèle à la documentation récupérée.
spring.ai.openai.chat.temperature=0.2
# ==================================================================
# PgVector
# ==================================================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# ==================================================================
# Orange Assistance Documentation
# ==================================================================
orange.assistance.allowed-hosts=www.orange.fr,assistance.orange.fr
orange.assistance.timeout=15000
orange.assistance.user-agent=Mozilla/5.0

# ==================================================================
# RAG - Vector Search
# ==================================================================

# Nombre maximum de chunks/documentations récupérés depuis PgVector
# pour une question utilisateur.
# Plus la valeur est élevée, plus le contexte envoyé au LLM sera grand.
# 3 est un bon point de départ pour limiter le bruit et la latence.
rag.search.top-k=4

# Seuil minimum de similarité pour accepter un résultat vectoriel.
# Valeur comprise entre 0 et 1.
# Exemple : 0.65 signifie que les chunks avec une similarité inférieure
# à 65% seront ignorés.
# Plus le seuil est élevé, plus la recherche est stricte.
rag.search.similarity-threshold=0.0

# ==================================================================
# RAG - Document Splitting
# ==================================================================

# Taille cible maximale d'un chunk en tokens.
# Le splitter essaie de découper chaque document autour de cette taille.
# 400 permet de rester sous la limite de 512 tokens de ton modèle d'embedding.
rag.splitter.chunk-size=400

# Taille minimale en caractères avant d'accepter une coupure naturelle
# dans le texte.
# Cela évite de créer trop rapidement des petits chunks.
rag.splitter.min-chunk-size-chars=100

# Taille minimale d'un chunk pour qu'il soit conservé et envoyé
# au modèle d'embedding.
# Les morceaux trop courts ou peu utiles peuvent ainsi être ignorés.
rag.splitter.min-chunk-length-to-embed=5

# Nombre maximum de chunks pouvant être générés à partir d'un seul document.
# Cette limite sert principalement de protection contre les documents
# anormalement volumineux ou une mauvaise extraction HTML.
rag.splitter.max-num-chunks=10000

# Indique si les séparateurs du texte doivent être conservés
# lors du découpage : retours à la ligne, séparations de paragraphes, etc.
# true permet de mieux préserver la structure du tutoriel.
rag.splitter.keep-separator=true