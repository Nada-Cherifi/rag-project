spring.application.name=rag-backend

# ======================================================================
# PostgreSQL
# ======================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=raguser
spring.datasource.password=ragpwd
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =======================================================================
# Spring AI OpenAI Configuration - LOCAL EMBEDDING MODEL
# =======================================================================
spring.ai.openai.embedding.base-url=http://127.0.0.1:1234/v1
spring.ai.openai.embedding.api-key=lm-studio
spring.ai.openai.embedding.model=text-embedding-nomic-embed-text-v2-moe
spring.ai.openai.embedding.dimensions=768

